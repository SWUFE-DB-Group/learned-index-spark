# ============================================================
# LiLIS 集群节点配置
# 请根据实际情况填写 IP 地址和主机名
# 格式: IP地址  主机名  角色
# ============================================================

# Master 节点 (同时运行 NameNode + Spark Master)
192.168.1.100  master  master

# Worker 节点 (运行 DataNode + Spark Worker)
192.168.1.101  worker1  worker
192.168.1.102  worker2  worker
192.168.1.103  worker3  worker
192.168.1.104  worker4  worker
192.168.1.105  worker5  worker
192.168.1.106  worker6  worker

# ============================================================
# 配置参数
# ============================================================

# 部署用户 (需要在所有节点上存在且有 sudo 权限)
DEPLOY_USER=hadoop

# 安装目录
INSTALL_DIR=/opt/bigdata

# Java 版本
JAVA_VERSION=8

# Hadoop 版本
HADOOP_VERSION=3.3.6

# Spark 版本
SPARK_VERSION=3.0.3

# HDFS 数据目录
HDFS_DATA_DIR=/data/hdfs

# Spark Worker 内存 (每个 Worker 可用内存)
SPARK_WORKER_MEMORY=16g

# Spark Worker 核心数 (每个 Worker 可用核心数)
SPARK_WORKER_CORES=8
